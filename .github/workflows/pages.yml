name: Build and deploy IntroGenerator
on:
  push:
    branches: [main, feat/full-v1]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke and sb3 roundtrip
        run: |
          npx vite --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          node tests/browser-smoke.mjs
          node tests/music-section-background-browser.mjs
          node tests/performance-browser.mjs
          node tests/depth-background-browser.mjs
          node tests/features-browser.mjs
          node tests/easing-browser.mjs
          node tests/camera-browser.mjs
          node tests/camera-shake-browser.mjs
          node tests/text-browser.mjs
          node tests/temporal-echo-browser.mjs
          node tests/camera-echo-browser.mjs
          node tests/repeating-background-browser.mjs
          node tests/generators-browser.mjs
          node tests/scratch-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/

      - run: cp -r artifacts dist/qa
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4